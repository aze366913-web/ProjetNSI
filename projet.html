        <h1>Les Volcans</h1>
        <p class="paragraphe1">Un volcan est une structure géologique qui résulte de la montée d'un magma puis de l'éruption de matériaux (gaz et lave) issus de ce magma, à la surface de la croûte terrestre ou d'un autre astre. Il peut être aérien ou sous-marin.</p>
